<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact Jihad HQ for inquiries and collaboration">
    <link rel="icon" href="favicon.svg" type="image/svg+xlm">
    <title>Contact form</title>
</head>
<body>
    <header>
        <h1>Jihad Head Quarter</h1>
        <nav>
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/about">About</a></li>
                <li><a href="/privacy">Privacy &amp; Policy</a></li>
                <li><a href="/terms">Terms of Service</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h2>Contact us</h2>
        <form action="/submite-data" method="POST">
            <div>
                <label for="username">full name:</label>
                <input type="text" id="username" name="username" maxlength="100" placeholder="jihadhq" required>
            </div>
            <div>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" maxlength="100" placeholder="jihadhq@example.com" required>
            </div>
            <div>
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" minlength="6" maxlength="50" placeholder="Enter password" required>
            </div>
            <fieldset>
                <legend>Choose your gender</legend>
                <label>
                    <input type="radio" name="gender" value="male" required>Male
                </label>
                <label>
                    <input type="radio" name="gender" value="female">Female
                </label>
            </fieldset>
            <div>
                <label for="country">Country</label>
                <select id="country" name="country" required>
                    <option value=""><--Select your country--></option>
                    <option value="bd">Bangladesh</option>
                    <option value="in">India</option>
                    <option value="us">USA</option>
                    <option value="others">Others country</option>
                </select>
            </div>
            <button type="submit">Send Message</button>
        </form>
    </main>
    <footer>
        <p>&copy; 2026 Jihad Head Quarter. All rights received</p>
        <p><a href="/privacy">Privacy &amp; Policy</a></p>
        <p><a href="/terms">Terms of Service</a></p>
    </footer>
</body>
</html>
